<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153e52">
  <meta name="robots" content="noindex,nofollow">
  <title>DPRO相談支援センター｜事業所管理</title>
  <!-- SODAN-5-R3: 管理コード削除・ブラウザ自動入力対策 -->
  <style>
    :root{--main:#153e52;--main2:#176b68;--accent:#0e7490;--bg:#eef4f5;--card:#fff;--text:#14252b;--muted:#607176;--line:#c8d7da;--danger:#b42318;--dangerbg:#fff1f0;--ok:#18794e;--okbg:#edf9f2;--warn:#9a6700;--warnbg:#fff8df;--info:#174b66;--infobg:#edf6fb;--sidebar:260px}
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.55}button,input,select,textarea{font:inherit}button,input,select{min-height:46px}.admin-code-mask{-webkit-text-security:disc}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.login-wrap{width:min(520px,100%);margin:0 auto;padding:42px 16px}.brand{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;padding:24px;border-radius:18px 18px 0 0}.brand h1{font-size:1.55rem;margin:4px 0 6px}.login-card{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:24px}.field{margin-bottom:18px}.field label{display:block;font-weight:800;margin-bottom:7px}.control{width:100%;border:1px solid #94adb2;border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}textarea.control{min-height:120px;resize:vertical}.control:focus{outline:3px solid rgba(14,116,144,.18);border-color:var(--accent)}.code-row{display:grid;grid-template-columns:1fr 84px;gap:8px}.primary,.secondary,.danger,.ghost{border-radius:10px;padding:10px 14px;font-weight:800}.primary{border:0;background:var(--main2);color:#fff}.secondary{border:1px solid #8eafb4;background:#fff;color:var(--main)}.danger{border:1px solid #d8a19b;background:#fff;color:var(--danger)}.ghost{border:0;background:transparent;color:var(--main)}.wide{width:100%}.status{display:none;border-radius:10px;padding:12px 14px;margin:12px 0}.status.show{display:block}.status.error{background:var(--dangerbg);border:1px solid #efa59e;color:#7a271a}.status.success{background:var(--okbg);border:1px solid #9fd7b9;color:#125b3b}.status.info{background:var(--infobg);border:1px solid #a9d0e5;color:var(--info)}.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}.sidebar{background:var(--main);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.side-title{font-weight:900;font-size:1.15rem;padding:3px 8px}.side-sub{font-size:.84rem;opacity:.8;padding:0 8px 18px}.nav{display:grid;gap:7px}.nav button{width:100%;border:0;background:transparent;color:#fff;text-align:left;border-radius:10px;padding:11px 12px;font-weight:700}.nav button.active,.nav button:hover{background:rgba(255,255,255,.14)}.side-bottom{position:absolute;left:14px;right:14px;bottom:18px}.session-name{font-size:.88rem;opacity:.9;margin:0 4px 8px}.content{min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.topbar h1{font-size:1.35rem;margin:0}.topbar p{margin:2px 0 0;color:var(--muted);font-size:.88rem}.main{padding:20px 22px 44px;max-width:1500px}.section{display:none}.section.active{display:block}.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.metric .label{font-size:.86rem;color:var(--muted)}.metric .value{font-size:1.7rem;font-weight:900;margin-top:3px}.metric.alert .value{color:var(--danger)}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.card h2{font-size:1.15rem;margin:0 0 12px}.card h3{font-size:1rem;margin:0}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.toolbar .field{margin:0;min-width:160px}.toolbar .grow{flex:1;min-width:240px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.inquiry-table{border-collapse:collapse;width:100%;min-width:820px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:11px 12px;border-bottom:1px solid #e3eaec;text-align:left;vertical-align:top}th{background:#f5f8f9;font-size:.86rem;white-space:nowrap}tbody tr:hover{background:#f8fbfb}.clickable{cursor:pointer}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:800;background:#e9f3f4;color:var(--main)}.badge.high,.badge.emergency,.badge.overdue{background:var(--dangerbg);color:var(--danger)}.badge.pending,.badge.reviewing{background:var(--warnbg);color:#6f4d00}.badge.ok,.badge.converted,.badge.approved{background:var(--okbg);color:var(--ok)}.list{display:grid;gap:9px}.list-item{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}.list-head{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:.88rem}.required{color:var(--danger);font-size:.78rem;margin-left:6px}.empty{padding:18px;border-radius:10px;background:#f6f9f9;color:var(--muted)}.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(430px,.65fr);gap:14px}.detail{position:sticky;top:92px;max-height:calc(100vh - 115px);overflow:auto}.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.detail h2{margin:0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.kv{background:#f5f8f9;border-radius:9px;padding:10px}.kv b{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}.summary{white-space:pre-wrap;background:#f7faf9;border-radius:10px;padding:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.check{display:flex;gap:9px;align-items:flex-start}.check input{min-height:auto;margin-top:5px;transform:scale(1.2)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.modal{position:fixed;inset:0;background:rgba(10,28,34,.55);display:grid;place-items:center;padding:16px;z-index:20}.modal-card{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.modal-head h2{margin:0}.close{border:0;background:#eef3f4;border-radius:50%;width:42px;height:42px;font-size:1.25rem}.warning{background:var(--warnbg);border:1px solid #e7c75b;border-radius:10px;padding:12px;margin:10px 0}.tabs-mobile{display:none}.footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
    @media(max-width:1100px){.metric-grid{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}.detail{position:static;max-height:none}.grid-2{grid-template-columns:1fr}}
    @media(max-width:760px){.shell{display:block}.sidebar{display:none}.topbar{position:static;padding:13px 12px}.main{padding:12px}.tabs-mobile{display:flex;overflow:auto;gap:6px;background:var(--main);padding:8px}.tabs-mobile button{border:0;border-radius:8px;background:transparent;color:#fff;white-space:nowrap;padding:8px 11px}.tabs-mobile button.active{background:rgba(255,255,255,.18)}.metric-grid{grid-template-columns:1fr 1fr}.form-grid,.detail-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.toolbar{align-items:stretch}.toolbar .field,.toolbar .grow{min-width:100%;width:100%}.topbar-actions{display:none}.card{padding:15px}table{min-width:760px}}
  </style>
</head>
<body>
<div class="app">
  <section id="loginView" class="login-wrap">
    <div class="brand"><div>DPRO相談支援センター（デモ）</div><h1>事業所PC管理画面</h1><div>相談受付・担当割当・LINE連携承認</div></div>
    <div class="login-card">
      <div id="loginStatus" class="status" role="alert"></div>
      <div class="field"><label for="adminCode">管理コード</label><div class="code-row"><input id="adminCode" class="control admin-code-mask" type="text" inputmode="numeric" autocomplete="off" name="sodan_admin_code_input" data-lpignore="true" data-1p-ignore="true" autocapitalize="off" spellcheck="false" maxlength="32" placeholder="管理コードを入力" aria-label="管理コード"><button id="clearCode" class="secondary" type="button">削除</button></div></div>
      <button id="loginButton" class="primary wide" type="button">管理画面へログイン</button>
      <p class="muted">デモ管理コード：1234</p>
    </div>
  </section>

  <section id="adminView" class="shell hidden">
    <aside class="sidebar">
      <div class="side-title">DPRO SODAN</div><div class="side-sub">事業所管理</div>
      <nav class="nav" aria-label="管理メニュー">
        <button data-section="dashboard" class="active">今日の管理</button>
        <button data-section="inquiries">相談受付</button>
        <button data-section="lineLinks">LINE連携申請</button>
        <button data-section="manual">電話・来所受付</button>
        <button data-section="search">横断検索</button>
      </nav>
      <div class="side-bottom"><p id="sessionName" class="session-name"></p><button id="logoutButton" class="secondary wide" type="button">ログアウト</button></div>
    </aside>
    <div class="content">
      <div class="tabs-mobile">
        <button data-section="dashboard" class="active">今日</button><button data-section="inquiries">相談受付</button><button data-section="lineLinks">LINE連携</button><button data-section="manual">手動受付</button><button data-section="search">検索</button>
      </div>
      <header class="topbar"><div><h1 id="pageTitle">今日の管理</h1><p id="officeLabel">DPRO相談支援センター（デモ）</p></div><div class="topbar-actions"><button id="refreshButton" class="secondary" type="button">最新情報に更新</button></div></header>
      <main class="main">
        <div id="globalStatus" class="status" role="alert" aria-live="polite"></div>
        <section id="section-dashboard" class="section active">
          <div id="metrics" class="metric-grid"></div>
          <div class="grid-2"><div class="card"><h2>新しい相談受付</h2><div id="recentInquiries" class="list"></div></div><div class="card"><h2>本日の面談・訪問</h2><div id="todayAppointments" class="list"></div></div></div>
          <div class="card" style="margin-top:14px"><h2>期限・未対応アラート</h2><div id="alerts" class="list"></div></div>
        </section>

        <section id="section-inquiries" class="section">
          <div class="toolbar"><div class="field grow"><label for="inquiryQuery">氏名・電話・受付番号</label><input id="inquiryQuery" class="control" placeholder="例：INQ-000001、山田、090"></div><div class="field"><label for="inquiryStatus">状態</label><select id="inquiryStatus" class="control"><option value="all">すべて</option><option value="new">新規</option><option value="reviewing">確認中</option><option value="contacting">連絡中</option><option value="appointment_scheduled">面談確定</option><option value="converted">案件化済み</option><option value="referred">他機関紹介</option><option value="closed">終了</option></select></div><div class="field"><label for="inquiryUrgency">緊急度</label><select id="inquiryUrgency" class="control"><option value="all">すべて</option><option value="normal">通常</option><option value="high">高</option><option value="emergency">緊急</option></select></div><button id="filterInquiries" class="primary" type="button">表示</button></div>
          <div class="split"><div class="table-wrap"><table class="inquiry-table"><thead><tr><th>受付番号</th><th>受付日時</th><th>相談者</th><th>緊急度</th><th>状態</th><th>担当</th><th>対応期限</th></tr></thead><tbody id="inquiryRows"></tbody></table></div><aside id="inquiryDetail" class="card detail"><div class="empty">左の相談受付を選択してください。</div></aside></div>
        </section>

        <section id="section-lineLinks" class="section">
          <div class="toolbar"><div class="field"><label for="linkStatus">申請状態</label><select id="linkStatus" class="control"><option value="pending">承認待ち</option><option value="approved">承認済み</option><option value="rejected">却下</option><option value="all">すべて</option></select></div><button id="loadLinks" class="primary" type="button">表示</button></div>
          <div id="lineLinkList" class="list"></div>
        </section>

        <section id="section-manual" class="section">
          <div class="card"><h2>電話・来所相談を登録</h2><div id="manualDuplicate" class="warning hidden"></div><form id="manualForm"><div class="form-grid">
            <div class="field"><label for="manualSource">受付経路</label><select id="manualSource" class="control"><option value="phone">電話</option><option value="visit">来所</option><option value="family">家族</option><option value="provider">支援機関</option><option value="municipality">行政</option><option value="other">その他</option></select></div>
            <div class="field"><label for="manualRequesterType">相談者区分</label><select id="manualRequesterType" class="control"><option value="client">本人</option><option value="family">家族</option><option value="guardian">後見人・保護者</option><option value="provider">支援機関</option><option value="municipality">行政</option><option value="other">その他</option></select></div>
            <div class="field"><label for="manualName">相談者名<span class="required">必須</span></label><input id="manualName" class="control" maxlength="100" required></div><div class="field"><label for="manualPhone">電話番号</label><input id="manualPhone" class="control" type="tel" inputmode="tel" maxlength="40"></div>
            <div class="field"><label for="manualEmail">メール</label><input id="manualEmail" class="control" type="email" maxlength="200"></div><div class="field"><label for="manualSupportType">相談対象</label><select id="manualSupportType" class="control"><option value="unknown">まず相談</option><option value="plan_consultation">成人・計画相談</option><option value="child_consultation">障害児相談</option></select></div>
            <div class="field"><label for="manualUrgency">緊急度</label><select id="manualUrgency" class="control"><option value="normal">通常</option><option value="high">高</option><option value="emergency">緊急</option></select></div><div class="field"><label for="manualContactMethod">希望連絡方法</label><select id="manualContactMethod" class="control"><option value="phone">電話</option><option value="line">LINE</option><option value="email">メール</option><option value="visit">来所</option><option value="other">その他</option></select></div>
            <div class="field"><label for="manualStaff">担当相談員</label><select id="manualStaff" class="control"><option value="">未割当</option></select></div><div></div>
            <div class="field full"><label for="manualSummary">相談内容<span class="required">必須・5文字以上</span></label><textarea id="manualSummary" class="control" maxlength="2000" required></textarea></div>
            <label id="manualEmergencyRow" class="check full hidden"><input id="manualEmergencyConfirm" type="checkbox"><span>緊急窓口ではないことを案内し、必要に応じて119番など適切な窓口を案内済みです。</span></label>
            <label id="manualDuplicateConfirmRow" class="check full hidden"><input id="manualAllowDuplicate" type="checkbox"><span>上に表示された重複候補を確認し、別の相談受付として登録します。</span></label>
          </div><div class="actions"><button id="manualSubmit" class="primary" type="submit">相談受付を登録する</button><button id="resetManual" class="secondary" type="button">入力をクリア</button></div></form></div>
        </section>

        <section id="section-search" class="section"><div class="card"><h2>利用者・相談受付の横断検索</h2><div class="toolbar"><div class="field grow"><label for="globalQuery">氏名・電話・利用者番号・受付番号</label><input id="globalQuery" class="control"></div><button id="runSearch" class="primary" type="button">検索</button></div><div class="grid-2"><div><h3>相談受付</h3><div id="searchInquiries" class="list"></div></div><div><h3>利用者</h3><div id="searchClients" class="list"></div></div></div></div></section>
        <div class="footer"><span id="appVersion"></span></div>
      </main>
    </div>
  </section>
</div>

<div id="convertModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="convertTitle"><div class="modal-card"><div class="modal-head"><div><h2 id="convertTitle">利用者・案件へ登録</h2><p class="muted">相談受付から利用者と案件を作成します。</p></div><button id="closeConvert" class="close" type="button" aria-label="閉じる">×</button></div><div id="convertDuplicate" class="warning hidden"></div><form id="convertForm"><div class="form-grid"><div class="field"><label for="convertSupportType">相談支援区分</label><select id="convertSupportType" class="control"><option value="plan_consultation">成人・計画相談</option><option value="child_consultation">障害児相談</option></select></div><div class="field"><label for="convertStaff">担当相談員</label><select id="convertStaff" class="control"><option value="">未割当</option></select></div><div class="field"><label for="convertFamilyName">利用者の姓</label><input id="convertFamilyName" class="control" required></div><div class="field"><label for="convertGivenName">利用者の名</label><input id="convertGivenName" class="control" required></div><div class="field"><label for="convertBirthDate">生年月日</label><input id="convertBirthDate" class="control" type="date"></div><div class="field"><label for="convertPhone">電話番号</label><input id="convertPhone" class="control" type="tel"></div><div class="field full"><label for="convertEmail">メール</label><input id="convertEmail" class="control" type="email"></div><label class="check full"><input id="convertForceDuplicate" type="checkbox"><span>重複候補を確認したうえで新しい利用者として登録します。</span></label></div><div class="actions"><button class="primary" type="submit">利用者・案件を登録</button><button id="cancelConvert" class="secondary" type="button">キャンセル</button></div></form></div></div>

<script src="config.js"></script>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const C=window.DPRO_CONFIG||{}; const API=String(C.workerUrl||'').replace(/\/+$/,'');
  const state={token:sessionStorage.getItem('sodan_owner_token')||'',session:null,staff:[],currentInquiry:null,section:'dashboard',manualDuplicateReady:false};
  $('appVersion').textContent=C.version||'';
  const labels={new:'新規',reviewing:'確認中',contacting:'連絡中',appointment_scheduled:'面談確定',converted:'案件化済み',referred:'他機関紹介',closed:'終了',normal:'通常',high:'高',emergency:'緊急',pending:'承認待ち',approved:'承認済み',rejected:'却下',revoked:'連携解除',phone:'電話',visit:'来所',line:'LINE',family:'家族',provider:'支援機関',municipality:'行政',other:'その他',client:'本人',guardian:'後見人・保護者',unknown:'まず相談したい・相談対象未確定',plan_consultation:'成人・計画相談支援',child_consultation:'障害児相談支援',requested:'確認待ち',confirmed:'確定',in_progress:'実施中',completed:'完了',cancelled:'キャンセル',no_show:'未実施'};
  function setStatus(id,msg,type='info'){const e=$(id);e.className=`status show ${type}`;e.textContent=msg;} function clearStatus(id){const e=$(id);e.className='status';e.textContent='';}
  async function api(path,opt={}){const h=new Headers(opt.headers||{});if(opt.body!==undefined)h.set('Content-Type','application/json');if(state.token)h.set('Authorization',`Bearer ${state.token}`);const r=await fetch(`${API}${path}`,{method:opt.method||'GET',headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body),cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok){const err=new Error(d.message||'処理に失敗しました。');err.status=r.status;err.data=d;throw err;}return d;}
  function formatDate(v,withTime=true){if(!v)return'—';const d=new Date(v);if(!Number.isFinite(d.getTime()))return esc(v);return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',...(withTime?{hour:'2-digit',minute:'2-digit'}:{})}).format(d)}
  function normalizePhone(v){let x=String(v||'').normalize('NFKC').replace(/[\s\-‐‑‒–—―ーｰ()（）.]/g,'').replace(/[^0-9+]/g,'');if(x.startsWith('+81'))x='0'+x.slice(3);else if(x.startsWith('0081'))x='0'+x.slice(4);return x.replace(/\D/g,'')}
  function formatPhone(v){if(!v)return'';let x=String(v).normalize('NFKC').replace(/[‐‑‒–—−ー]/g,'-').replace(/\s+/g,'');const digits=x.replace(/\D/g,'');if(/^0[789]0\d{8}$/.test(digits))return `${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}`;return x}
  function badge(v){return `<span class="badge ${esc(v)}">${esc(labels[v]||v||'—')}</span>`}
  function staffOptions(selected=''){return `<option value="">未割当</option>`+state.staff.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.displayName)}</option>`).join('')}
  async function login(){clearStatus('loginStatus');const code=$('adminCode').value.trim();if(!code){setStatus('loginStatus','管理コードを入力してください。','error');return}try{const d=await api('/api/auth/admin/login',{method:'POST',body:{adminCode:code,staffCode:'DEMO-ADMIN'}});state.token=d.accessToken;state.session=d.session;sessionStorage.setItem('sodan_owner_token',state.token);showAdmin();await initialLoad()}catch(e){setStatus('loginStatus',e.message,'error')}}
  async function validateSession(){if(!state.token)return false;try{const d=await api('/api/auth/session');state.session=d.session;return true}catch{sessionStorage.removeItem('sodan_owner_token');state.token='';return false}}
  function showAdmin(){$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');$('sessionName').textContent=state.session?.displayName||'管理者'}
  function logout(){sessionStorage.removeItem('sodan_owner_token');state.token='';state.session=null;location.reload()}
  async function initialLoad(){await loadStaff();await Promise.all([loadDashboard(),loadInquiries(),loadLinks()])}
  async function loadStaff(){const d=await api('/api/admin/staff');state.staff=d.staff||[];$('manualStaff').innerHTML=staffOptions();$('convertStaff').innerHTML=staffOptions()}
  async function loadDashboard(){try{const d=await api('/api/admin/dashboard');const x=d.dashboard;$('metrics').innerHTML=[['新規相談',x.counts.newInquiries],['対応中相談',x.counts.activeInquiries],['本日の予定',x.counts.todayAppointments],['LINE承認待ち',x.counts.pendingLineLinks],['期限超過',x.counts.overdue,'alert']].map(v=>`<div class="metric ${v[2]||''}"><div class="label">${v[0]}</div><div class="value">${v[1]}</div></div>`).join('');$('recentInquiries').innerHTML=x.recentInquiries.length?x.recentInquiries.map(i=>`<button class="list-item clickable" data-inquiry-id="${i.id}" type="button"><div class="list-head"><b>${esc(i.inquiryNo)} ${esc(i.requesterName)}</b>${badge(i.urgency)}</div><div class="muted">${formatDate(i.createdAt)}／${badge(i.status)}</div><div>${esc(i.summary)}</div></button>`).join(''):'<div class="empty">新しい相談受付はありません。</div>';$('todayAppointments').innerHTML=x.todayAppointments.length?x.todayAppointments.map(a=>`<div class="list-item"><div class="list-head"><b>${formatDate(a.startAt)} ${esc(a.location||'')}</b>${badge(a.status)}</div><div>${esc(a.publicNote||'予定')}</div></div>`).join(''):'<div class="empty">本日の面談・訪問はありません。</div>';const alerts=[...(x.alerts.inquiries||[]).map(i=>`相談 ${i.inquiryNo} ${i.requesterName}`),...(x.alerts.tasks||[]).map(t=>`タスク ${t.taskNo} ${t.title}`),...(x.alerts.documents||[]).map(d=>`書類 ${d.requestNo} ${d.title}`)];$('alerts').innerHTML=alerts.length?alerts.map(v=>`<div class="list-item"><span class="badge overdue">期限超過</span> ${esc(v)}</div>`).join(''):'<div class="empty">期限超過はありません。</div>';$('recentInquiries').querySelectorAll('[data-inquiry-id]').forEach(b=>b.addEventListener('click',()=>{switchSection('inquiries');openInquiry(b.dataset.inquiryId)}))}catch(e){setStatus('globalStatus',e.message,'error')}}
  async function loadInquiries(){try{const p=new URLSearchParams({status:$('inquiryStatus').value,urgency:$('inquiryUrgency').value,q:$('inquiryQuery').value.trim()});const d=await api(`/api/admin/inquiries?${p}`);$('inquiryRows').innerHTML=d.inquiries.length?d.inquiries.map(i=>`<tr class="clickable" data-id="${i.id}"><td><b>${esc(i.inquiryNo)}</b></td><td>${formatDate(i.createdAt)}</td><td>${esc(i.requesterName)}<div class="muted">${esc(formatPhone(i.requesterPhone))}</div></td><td>${badge(i.urgency)}</td><td>${badge(i.status)}</td><td>${esc(i.assignedStaffName||'未割当')}</td><td>${i.responseDueAt?formatDate(i.responseDueAt):'—'}</td></tr>`).join(''):'<tr><td colspan="7">該当する相談受付はありません。</td></tr>';$('inquiryRows').querySelectorAll('tr[data-id]').forEach(r=>r.addEventListener('click',()=>openInquiry(r.dataset.id)))}catch(e){setStatus('globalStatus',e.message,'error')}}
  async function openInquiry(id){try{const d=await api(`/api/admin/inquiries/${id}`);state.currentInquiry=d.inquiry;renderInquiryDetail(d)}catch(e){setStatus('globalStatus',e.message,'error')}}
  function renderInquiryDetail(d){const i=d.inquiry;const dup=d.duplicateCandidates||[];$('inquiryDetail').innerHTML=`<div class="detail-head"><div><h2>${esc(i.inquiryNo)}</h2><div>${badge(i.urgency)} ${badge(i.status)}</div></div><button id="closeDetail" class="ghost" type="button">閉じる</button></div><div class="detail-grid"><div class="kv"><b>相談者</b>${esc(i.requesterName)}</div><div class="kv"><b>受付経路</b>${esc(labels[i.source]||i.source)}</div><div class="kv"><b>電話</b>${esc(formatPhone(i.requesterPhone)||'—')}</div><div class="kv"><b>メール</b>${esc(i.requesterEmail||'—')}</div><div class="kv"><b>相談対象</b>${esc(labels[i.supportType]||i.supportType||'—')}</div><div class="kv"><b>受付日時</b>${formatDate(i.createdAt)}</div></div><div class="summary">${esc(i.summary)}</div>${dup.length?`<div class="warning"><b>重複候補</b>${dup.map(x=>`<div>${esc(x.clientNo)} ${esc(x.name)} ${esc(formatPhone(x.phone))}</div>`).join('')}</div>`:''}<div class="field"><label>状態</label><select id="detailStatus" class="control">${['new','reviewing','contacting','appointment_scheduled','converted','referred','closed'].map(v=>`<option value="${v}" ${v===i.status?'selected':''}>${labels[v]}</option>`).join('')}</select></div><div class="field"><label>担当相談員</label><select id="detailStaff" class="control">${staffOptions(i.assignedStaffId||'')}</select></div><div class="field"><label>対応記録（任意）</label><textarea id="detailNote" class="control" placeholder="電話連絡、折返し、説明内容など"></textarea></div><div class="actions"><button id="saveInquiry" class="primary" type="button">状態・担当を保存</button>${i.status!=='converted'?'<button id="openConvert" class="secondary" type="button">利用者・案件へ登録</button>':''}</div><h3 style="margin-top:18px">対応履歴</h3><div class="list">${d.communications.length?d.communications.map(c=>`<div class="list-item"><b>${esc(c.subject||'対応記録')}</b><div>${esc(c.summary)}</div><div class="muted">${formatDate(c.occurredAt)} ${esc(c.handledByName||'')}</div></div>`).join(''):'<div class="empty">対応履歴はありません。</div>'}</div>`;$('closeDetail').addEventListener('click',()=>{$('inquiryDetail').innerHTML='<div class="empty">左の相談受付を選択してください。</div>'});$('saveInquiry').addEventListener('click',saveInquiry);$('openConvert')?.addEventListener('click',()=>openConvertModal(dup))}
  async function saveInquiry(){const i=state.currentInquiry;try{const d=await api(`/api/admin/inquiries/${i.id}/update`,{method:'POST',body:{lockVersion:i.lockVersion,status:$('detailStatus').value,assignedStaffId:$('detailStaff').value||null,contactNote:$('detailNote').value.trim(),contactChannel:'internal',contactDirection:'internal'}});state.currentInquiry=d.inquiry;setStatus('globalStatus','相談受付を更新しました。','success');await Promise.all([loadInquiries(),loadDashboard()]);await openInquiry(i.id)}catch(e){setStatus('globalStatus',e.message,'error')}}
  function openConvertModal(duplicates){const i=state.currentInquiry;$('convertModal').classList.remove('hidden');$('convertSupportType').value=['plan_consultation','child_consultation'].includes(i.supportType)?i.supportType:'plan_consultation';$('convertStaff').value=i.assignedStaffId||'';const parts=String(i.requesterName||'').trim().split(/[\s　]+/);$('convertFamilyName').value=parts[0]||'';$('convertGivenName').value=parts.slice(1).join(' ')||'';$('convertPhone').value=i.requesterPhone||'';$('convertEmail').value=i.requesterEmail||'';$('convertForceDuplicate').checked=false;$('convertDuplicate').classList.toggle('hidden',!duplicates.length);$('convertDuplicate').innerHTML=duplicates.length?`<b>重複候補があります。</b>${duplicates.map(x=>`<div>${esc(x.clientNo)} ${esc(x.name)}</div>`).join('')}`:''}
  async function convertInquiry(ev){ev.preventDefault();const i=state.currentInquiry;try{const d=await api(`/api/admin/inquiries/${i.id}/convert`,{method:'POST',body:{lockVersion:i.lockVersion,supportType:$('convertSupportType').value,assignedStaffId:$('convertStaff').value||null,familyName:$('convertFamilyName').value.trim(),givenName:$('convertGivenName').value.trim(),birthDate:$('convertBirthDate').value||null,phone:$('convertPhone').value.trim(),email:$('convertEmail').value.trim(),forceDuplicate:$('convertForceDuplicate').checked}});$('convertModal').classList.add('hidden');setStatus('globalStatus',`利用者 ${d.client.clientNo}、案件 ${d.case.caseNo} を登録しました。`,'success');await Promise.all([loadInquiries(),loadDashboard()]);await openInquiry(i.id)}catch(e){if(e.status===409&&e.data?.details?.duplicateCandidates){$('convertDuplicate').classList.remove('hidden');$('convertDuplicate').innerHTML='<b>重複候補を確認してください。</b>'+e.data.details.duplicateCandidates.map(x=>`<div>${esc(x.clientNo)} ${esc(x.name)}</div>`).join('')}setStatus('globalStatus',e.message,'error')}}
  async function loadLinks(){try{const d=await api(`/api/admin/line-links?status=${encodeURIComponent($('linkStatus').value)}`);$('lineLinkList').innerHTML=d.lineLinks.length?d.lineLinks.map(l=>`<div class="card"><div class="list-head"><div><h3>${esc(l.client?.clientNo||'')} ${esc(l.client?.name||'')}</h3><div class="muted">${l.actorType==='contact'?`家族・関係者：${esc(l.contact?.name||'')}（${esc(l.contact?.relationship||'')}）`:'ご本人'}</div></div>${badge(l.status)}</div><div class="muted">申請：${formatDate(l.requestedAt)}</div>${l.status==='pending'?`<div class="actions"><button class="primary approve-link" data-id="${l.id}" type="button">承認</button><button class="danger reject-link" data-id="${l.id}" type="button">却下</button></div>`:''}</div>`).join(''):'<div class="empty">該当するLINE連携申請はありません。</div>';$('lineLinkList').querySelectorAll('.approve-link').forEach(b=>b.addEventListener('click',()=>reviewLink(b.dataset.id,'approve')));$('lineLinkList').querySelectorAll('.reject-link').forEach(b=>b.addEventListener('click',()=>reviewLink(b.dataset.id,'reject')))}catch(e){setStatus('globalStatus',e.message,'error')}}
  async function reviewLink(id,decision){if(!confirm(decision==='approve'?'このLINE連携申請を承認しますか？':'このLINE連携申請を却下しますか？'))return;try{await api(`/api/admin/line-links/${id}/review`,{method:'POST',body:{decision,reason:decision==='reject'?'事業所確認により却下':null}});setStatus('globalStatus',decision==='approve'?'LINE連携を承認しました。':'LINE連携を却下しました。','success');await Promise.all([loadLinks(),loadDashboard()])}catch(e){setStatus('globalStatus',e.message,'error')}}
  function newIdempotencyKey(){return (crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`)+'-manual'}
  function toggleManualEmergency(){$('manualEmergencyRow').classList.toggle('hidden',$('manualUrgency').value!=='emergency');if($('manualUrgency').value!=='emergency')$('manualEmergencyConfirm').checked=false}
  function resetManualDuplicate(){state.manualDuplicateReady=false;$('manualDuplicate').classList.add('hidden');$('manualDuplicate').innerHTML='';$('manualDuplicateConfirmRow').classList.add('hidden');$('manualAllowDuplicate').checked=false}
  function resetManualForm(){$('manualForm').reset();resetManualDuplicate();toggleManualEmergency();clearStatus('globalStatus')}
  function manualPayload(){return{source:$('manualSource').value,requesterType:$('manualRequesterType').value,requesterName:$('manualName').value.trim(),requesterPhone:$('manualPhone').value.trim(),requesterEmail:$('manualEmail').value.trim(),supportType:$('manualSupportType').value,summary:$('manualSummary').value.trim(),urgency:$('manualUrgency').value,preferredContactMethod:$('manualContactMethod').value,assignedStaffId:$('manualStaff').value||null,emergencyConfirmed:$('manualEmergencyConfirm').checked,allowDuplicate:state.manualDuplicateReady&&$('manualAllowDuplicate').checked}}
  function validateManualPayload(p){const errors=[];if(p.requesterName.length<2)errors.push('相談者名を入力してください。');if(p.summary.length<5)errors.push('相談内容を5文字以上で入力してください。');const phone=normalizePhone(p.requesterPhone);if(p.requesterPhone&&!/^0\d{9,10}$/.test(phone))errors.push('電話番号の形式を確認してください。');if(p.requesterEmail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.requesterEmail))errors.push('メールアドレスの形式を確認してください。');if(p.urgency==='emergency'&&!p.emergencyConfirmed)errors.push('緊急窓口ではないことを案内済みか確認してください。');if(state.manualDuplicateReady&&!p.allowDuplicate)errors.push('重複候補を確認し、確認欄にチェックしてください。');return errors}
  async function submitManual(ev){ev.preventDefault();const payload=manualPayload();const errors=validateManualPayload(payload);if(errors.length){setStatus('globalStatus',errors.join(' '),'error');return}const button=$('manualSubmit');button.disabled=true;button.textContent='登録中です…';try{const key=newIdempotencyKey();const d=await api('/api/admin/inquiries/manual',{method:'POST',headers:{'X-Idempotency-Key':key},body:{...payload,idempotencyKey:key}});setStatus('globalStatus',`受付番号 ${d.inquiry.inquiryNo} を登録しました。`,'success');$('manualForm').reset();resetManualDuplicate();toggleManualEmergency();await Promise.all([loadInquiries(),loadDashboard()]);switchSection('inquiries');await openInquiry(d.inquiry.id)}catch(e){const clients=e.data?.details?.duplicateCandidates||[];const inquiries=e.data?.details?.duplicateInquiries||[];if(e.status===409&&(clients.length||inquiries.length)){state.manualDuplicateReady=true;$('manualDuplicate').classList.remove('hidden');$('manualDuplicateConfirmRow').classList.remove('hidden');$('manualAllowDuplicate').checked=false;const clientHtml=clients.map(x=>`<div>利用者：${esc(x.clientNo||'')} ${esc(x.name||'')} ${esc(formatPhone(x.phone||''))}</div>`).join('');const inquiryHtml=inquiries.map(x=>`<div>相談受付：${esc(x.inquiryNo||'')} ${esc(x.requesterName||'')} ${esc(formatPhone(x.phone||''))}</div>`).join('');$('manualDuplicate').innerHTML='<b>重複候補があります。内容を確認してください。</b>'+clientHtml+inquiryHtml}setStatus('globalStatus',e.message,'error')}finally{button.disabled=false;button.textContent='相談受付を登録する'}}
  async function runSearch(){const q=$('globalQuery').value.trim();if(q.length<2){setStatus('globalStatus','2文字以上入力してください。','error');return}try{const d=await api(`/api/admin/search?q=${encodeURIComponent(q)}`);$('searchInquiries').innerHTML=d.inquiries.length?d.inquiries.map(i=>`<button type="button" class="list-item clickable search-inquiry" data-id="${i.id}"><b>${esc(i.inquiryNo)} ${esc(i.requesterName)}</b><div>${badge(i.status)} ${esc(i.summary)}</div></button>`).join(''):'<div class="empty">該当なし</div>';$('searchClients').innerHTML=d.clients.length?d.clients.map(c=>`<div class="list-item"><b>${esc(c.clientNo)} ${esc(c.name)}</b><div>${esc(formatPhone(c.phone))} ${badge(c.status)}</div></div>`).join(''):'<div class="empty">該当なし</div>';$('searchInquiries').querySelectorAll('.search-inquiry').forEach(b=>b.addEventListener('click',()=>{switchSection('inquiries');openInquiry(b.dataset.id)}))}catch(e){setStatus('globalStatus',e.message,'error')}}
  function switchSection(name){state.section=name;document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===`section-${name}`));document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===name));$('pageTitle').textContent={dashboard:'今日の管理',inquiries:'相談受付',lineLinks:'LINE連携申請',manual:'電話・来所受付',search:'横断検索'}[name]||'';clearStatus('globalStatus');if(name==='dashboard')loadDashboard();if(name==='inquiries')loadInquiries();if(name==='lineLinks')loadLinks()}
  async function refresh(){if(state.section==='dashboard')await loadDashboard();else if(state.section==='inquiries')await loadInquiries();else if(state.section==='lineLinks')await loadLinks();else if(state.section==='search')await runSearch();setStatus('globalStatus','最新情報に更新しました。','success')}
  function clearAdminCode(focus=true){const input=$('adminCode');input.value='';input.defaultValue='';input.removeAttribute('value');clearStatus('loginStatus');if(focus)requestAnimationFrame(()=>input.focus({preventScroll:true}))}
  $('loginButton').addEventListener('click',login);$('adminCode').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('clearCode').addEventListener('click',()=>clearAdminCode(true));$('logoutButton').addEventListener('click',logout);$('refreshButton').addEventListener('click',refresh);document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>switchSection(b.dataset.section)));$('filterInquiries').addEventListener('click',loadInquiries);$('inquiryQuery').addEventListener('keydown',e=>{if(e.key==='Enter')loadInquiries()});$('loadLinks').addEventListener('click',loadLinks);$('manualForm').addEventListener('submit',submitManual);$('manualUrgency').addEventListener('change',toggleManualEmergency);$('manualForm').addEventListener('input',e=>{if(e.target.id!=='manualAllowDuplicate'&&state.manualDuplicateReady)resetManualDuplicate()});$('resetManual').addEventListener('click',resetManualForm);toggleManualEmergency();$('runSearch').addEventListener('click',runSearch);$('globalQuery').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});$('convertForm').addEventListener('submit',convertInquiry);$('closeConvert').addEventListener('click',()=>$('convertModal').classList.add('hidden'));$('cancelConvert').addEventListener('click',()=>$('convertModal').classList.add('hidden'));$('convertModal').addEventListener('click',e=>{if(e.target===$('convertModal'))$('convertModal').classList.add('hidden')});
  window.addEventListener('pageshow',()=>{if(!state.token)clearAdminCode(false)});
  (async()=>{if(await validateSession()){showAdmin();await initialLoad()}else{clearAdminCode(false)}})();
})();
</script>
</body>
