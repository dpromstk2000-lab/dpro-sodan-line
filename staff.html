<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12495d">
  <meta name="robots" content="noindex,nofollow">
  <title>DPRO SODAN｜職員専用</title>
  <script src="config.js"></script>
  <style>
    :root{--nav:#12495d;--nav2:#2d6979;--bg:#eef5f6;--card:#fff;--line:#c7dadd;--text:#092b38;--muted:#607b84;--main:#0c8078;--danger:#b42318;--warn:#8a5700;--ok:#16784d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:var(--bg);line-height:1.5}button,input,select,textarea{font:inherit}button{touch-action:manipulation;cursor:pointer}.hidden{display:none!important}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:17px;padding:25px;box-shadow:0 12px 35px rgba(8,45,58,.08)}.login h1{font-size:27px;margin:0}.login .sub{color:var(--muted);margin:3px 0 19px}.field{margin:13px 0}.field label{display:block;font-weight:850;margin-bottom:6px}.code-row{display:grid;grid-template-columns:1fr 88px;gap:8px}.control{width:100%;min-height:51px;border:1px solid #92b2ba;border-radius:10px;padding:11px 13px;background:#fff}.control:focus{outline:3px solid rgba(12,128,120,.18);border-color:var(--main)}.code-mask{-webkit-text-security:disc}.btn{min-height:48px;border:1px solid #93b3ba;border-radius:10px;padding:11px 15px;background:#fff;color:var(--text);font-weight:850}.btn.primary{background:var(--main);border-color:var(--main);color:#fff}.btn.danger{color:var(--danger);border-color:#dca9a4}.btn:disabled{opacity:.55;cursor:wait}.wide{width:100%}
    .status{display:none;border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:700}.status.show{display:block}.status.success{background:#e9f8ef;border:1px solid #a9dbbd;color:#095f39}.status.error{background:#fff0ee;border:1px solid #efb0aa;color:#8b2016}.status.info{background:#eaf5f8;border:1px solid #afd1db;color:#174c60}
    .app{min-height:100vh;display:grid;grid-template-columns:225px 1fr}.side{background:var(--nav);color:#fff;padding:19px 13px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:950}.side-sub{opacity:.8;margin:2px 0 20px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#fff;text-align:left;padding:13px;border-radius:10px;font-weight:850}.nav button.active,.nav button:hover{background:var(--nav2)}.account{margin-top:auto}.account-name{font-weight:850;margin-bottom:9px}.logout{width:100%;border:0;border-radius:10px;padding:12px;background:#fff;color:var(--text);font-weight:900}
    .main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 19px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:4}.top h1{font-size:23px;margin:0}.top small{display:block;color:var(--muted)}.content{padding:17px;max-width:1500px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:13px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.metric span{display:block;color:var(--muted);font-size:13px}.metric b{font-size:28px}.metric.alert b{color:var(--danger)}
    .grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(350px,.9fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}.card h2{font-size:19px;margin:0 0 11px}.list{display:grid;gap:8px}.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.item.click:hover{border-color:#7eabb4}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--muted);font-size:13px}.badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#e8f2f3;font-size:12px;font-weight:850}.badge.danger{background:#fff0ee;color:var(--danger)}.empty{background:#f3f8f8;border-radius:9px;padding:16px;color:var(--muted)}
    .filters{display:grid;grid-template-columns:1fr 190px auto;gap:8px;margin-bottom:12px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:11px 0}.fact{background:#f3f8f8;border-radius:9px;padding:9px}.fact span{display:block;color:var(--muted);font-size:12px}.fact b{overflow-wrap:anywhere}.form{display:grid;gap:10px;margin-top:12px}.form label{font-weight:850}.form textarea{min-height:95px;resize:vertical}.task-actions{display:flex;justify-content:flex-end;margin-top:8px}.version{text-align:center;color:var(--muted);font-size:12px;padding:19px}
    @media(max-width:1050px){.app{grid-template-columns:190px 1fr}.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
    @media(max-width:760px){.app{display:block}.side{height:auto;position:static;padding:10px}.brand,.side-sub,.account{display:none}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:10px 12px}.top{position:static}.content{padding:10px}.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.grid{display:block}.grid>.card{margin-bottom:10px}.code-row{grid-template-columns:1fr 80px}.top .btn{padding:9px}}
  </style>
</head>
<body>
<section id="loginView" class="login-wrap">
  <form id="loginForm" class="login" autocomplete="off">
    <h1>DPRO SODAN</h1><div class="sub">職員専用画面</div>
    <div id="loginStatus" class="status" role="alert" aria-live="polite"></div>
    <div class="field"><label for="staffCode">職員コード</label><div class="code-row"><input id="staffCode" class="control" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DEMO-STF-01" maxlength="50"><button id="clearStaffCode" class="btn" type="button">削除</button></div></div>
    <div class="field"><label for="accessCode">職員アクセスコード</label><div class="code-row"><input id="accessCode" class="control code-mask" autocomplete="one-time-code" spellcheck="false" maxlength="64"><button id="clearAccessCode" class="btn" type="button">削除</button></div></div>
    <button id="loginButton" class="btn primary wide" type="submit">ログイン</button>
  </form>
</section>

<section id="appView" class="app hidden">
  <aside class="side">
    <div class="brand">DPRO SODAN</div><div class="side-sub">職員専用</div>
    <nav class="nav"><button data-view="today" class="active">今日</button><button data-view="inquiries">相談受付</button><button data-view="cases">担当案件</button></nav>
    <div class="account"><div id="accountName" class="account-name">職員</div><button id="logout" class="logout" type="button">ログアウト</button></div>
  </aside>
  <main class="main">
    <header class="top"><div><h1 id="pageTitle">今日の業務</h1><small id="officeName">DPRO相談支援センター（デモ）</small></div><button id="refresh" class="btn primary" type="button">最新情報に更新</button></header>
    <div class="content">
      <div id="globalStatus" class="status" role="status" aria-live="polite"></div>
      <section id="todayView">
        <div id="metrics" class="metrics"></div>
        <div class="grid"><div class="card"><h2>担当相談</h2><div id="todayInquiries" class="list"></div></div><div class="card"><h2>本日の面談・訪問</h2><div id="todayAppointments" class="list"></div></div></div>
        <div class="grid" style="margin-top:13px"><div class="card"><h2>担当タスク</h2><div id="todayTasks" class="list"></div></div><div class="card"><h2>次の対応</h2><div id="todayCases" class="list"></div></div></div>
      </section>
      <section id="inquiriesView" class="hidden"><div class="filters"><input id="inquiryQ" class="control" placeholder="氏名・電話・受付番号"><select id="inquiryStatus" class="control"><option value="">すべて</option><option value="new">新規</option><option value="reviewing">確認中</option><option value="contacting">連絡中</option><option value="appointment_scheduled">面談調整済み</option><option value="closed">終了</option></select><button id="searchInquiries" class="btn primary" type="button">表示</button></div><div class="grid"><div class="card"><h2>担当相談受付</h2><div id="inquiryList" class="list"></div></div><div id="inquiryDetail" class="card"><div class="empty">左の相談を選択してください。</div></div></div></section>
      <section id="casesView" class="hidden"><div class="filters"><input id="caseQ" class="control" placeholder="氏名・電話・利用者番号・案件番号"><select id="caseStatus" class="control"><option value="">すべて</option><option value="new_consultation">新規相談</option><option value="assessment_in_progress">アセスメント中</option><option value="plan_draft_in_progress">計画案作成中</option><option value="service_in_use">サービス利用中</option><option value="monitoring_scheduled">モニタリング予定</option></select><button id="searchCases" class="btn primary" type="button">表示</button></div><div class="grid"><div class="card"><h2>担当案件</h2><div id="caseList" class="list"></div></div><div id="caseDetail" class="card"><div class="empty">左の案件を選択してください。</div></div></div></section>
      <div id="version" class="version"></div>
    </div>
  </main>
</section>
<script>
(() => {
  'use strict';
  const C=window.DPRO_CONFIG||{},API=String(C.workerUrl||'').replace(/\/+$/,''),$=id=>document.getElementById(id);
  const state={token:sessionStorage.getItem('sodan_staff_token')||'',session:null,view:'today',currentInquiry:null,currentCase:null};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=v=>{if(!v)return'—';const d=new Date(v);return Number.isFinite(d.getTime())?new Intl.DateTimeFormat('ja-JP',{timeZone:C.timezone||'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d):esc(v)};
  const label=v=>({new:'新規',reviewing:'確認中',contacting:'連絡中',appointment_scheduled:'面談調整済み',converted:'案件化済み',referred:'他機関紹介',closed:'終了',normal:'通常',high:'優先',emergency:'緊急',phone:'電話',line:'LINE',email:'メール',mail:'郵送',visit:'来所',other:'その他',new_consultation:'新規相談',assessment_in_progress:'アセスメント中',plan_draft_in_progress:'計画案作成中',service_in_use:'サービス利用中',monitoring_scheduled:'モニタリング予定',open:'未着手',in_progress:'対応中',waiting:'待機',completed:'完了',requested:'確認待ち',confirmed:'確定'}[v]||v||'—');
  const badge=v=>`<span class="badge">${esc(label(v))}</span>`;
  function showStatus(id,msg,type='success'){const e=$(id);e.textContent=msg;e.className=`status show ${type}`}
  function clearStatus(id){const e=$(id);e.textContent='';e.className='status'}
  async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('Content-Type','application/json');if(state.token)h.set('Authorization',`Bearer ${state.token}`);const r=await fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false){const e=new Error(d.message||`通信エラー ${r.status}`);e.status=r.status;throw e}return d}
  function clearLoginFields(){$('staffCode').value='';$('accessCode').value=''}
  function logout(){state.token='';state.session=null;state.currentInquiry=null;state.currentCase=null;sessionStorage.removeItem('sodan_staff_token');document.querySelectorAll('input,textarea').forEach(e=>e.value='');document.querySelectorAll('.list').forEach(e=>e.innerHTML='');location.reload()}
  async function login(){const staffCode=$('staffCode').value.trim().toUpperCase(),accessCode=$('accessCode').value;if(!staffCode||!accessCode){showStatus('loginStatus','職員コードとアクセスコードを入力してください。','error');return}const b=$('loginButton');b.disabled=true;b.textContent='確認中です…';try{const d=await api('/api/auth/staff/login',{method:'POST',body:{staffCode,accessCode}});state.token=d.accessToken;state.session=d.session;sessionStorage.setItem('sodan_staff_token',state.token);clearLoginFields();await showApp()}catch(e){showStatus('loginStatus',e.message,'error')}finally{b.disabled=false;b.textContent='ログイン'}}
  async function validate(){if(!state.token)return false;try{const d=await api('/api/auth/session');if(!d.session?.staff)return false;state.session=d.session;return true}catch{return false}}
  async function showApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('accountName').textContent=state.session?.displayName||'職員';$('version').textContent=C.version||'SODAN-13-R1-WEB-20260730';await loadDashboard()}
  function switchView(view){state.view=view;['today','inquiries','cases'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==view));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('pageTitle').textContent={today:'今日の業務',inquiries:'担当相談受付',cases:'担当案件'}[view];if(view==='today')loadDashboard();if(view==='inquiries')loadInquiries();if(view==='cases')loadCases()}
  async function loadDashboard(){clearStatus('globalStatus');try{const d=await api('/api/staff/dashboard'),x=d.dashboard;$('metrics').innerHTML=[['担当相談',x.counts.activeInquiries],['担当案件',x.counts.activeCases],['本日の予定',x.counts.todayAppointments],['未完了タスク',x.counts.openTasks],['期限超過',x.counts.overdue,'alert']].map(v=>`<div class="metric ${v[2]||''}"><span>${v[0]}</span><b>${v[1]}</b></div>`).join('');$('todayInquiries').innerHTML=x.inquiries.length?x.inquiries.map(i=>`<button class="item click" data-di="${esc(i.id)}"><div class="row"><b>${esc(i.inquiryNo)} ${esc(i.requesterName)}</b>${badge(i.urgency)}</div><div class="muted">${fmt(i.createdAt)}／${badge(i.status)}</div><div>${esc(i.summary)}</div></button>`).join(''):'<div class="empty">担当相談はありません。</div>';$('todayAppointments').innerHTML=x.appointments.length?x.appointments.map(a=>`<div class="item"><div class="row"><b>${fmt(a.startAt)}</b>${badge(a.status)}</div><div>${esc(a.location||label(a.appointmentType))}</div><div class="muted">${esc(a.publicNote||'')}</div></div>`).join(''):'<div class="empty">本日の予定はありません。</div>';$('todayTasks').innerHTML=x.tasks.length?x.tasks.map(t=>`<div class="item"><div class="row"><b>${esc(t.taskNo)} ${esc(t.title)}</b>${badge(t.status)}</div><div class="muted">期限 ${fmt(t.dueAt)}</div><div class="task-actions"><button class="btn primary" data-task="${esc(t.id)}" type="button">完了にする</button></div></div>`).join(''):'<div class="empty">未完了タスクはありません。</div>';$('todayCases').innerHTML=x.cases.length?x.cases.map(c=>`<button class="item click" data-dc="${esc(c.id)}"><div class="row"><b>${esc(c.caseNo)} ${esc(c.client?.name||'')}</b>${badge(c.status)}</div><div>${esc(c.nextAction||'次の対応未登録')}</div><div class="muted">期限 ${fmt(c.nextActionDueAt)}</div></button>`).join(''):'<div class="empty">担当案件はありません。</div>';document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{switchView('inquiries');openInquiry(b.dataset.di)});document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{switchView('cases');openCase(b.dataset.dc)});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>completeTask(b.dataset.task,b))}catch(e){showStatus('globalStatus',e.message,'error');if(e.status===401)setTimeout(logout,600)}}
  async function completeTask(id,b){if(!confirm('このタスクを完了にしますか？'))return;b.disabled=true;try{await api(`/api/staff/tasks/${id}/complete`,{method:'POST'});showStatus('globalStatus','タスクを完了にしました。');await loadDashboard()}catch(e){showStatus('globalStatus',e.message,'error')}finally{b.disabled=false}}
  async function loadInquiries(){try{const p=new URLSearchParams({q:$('inquiryQ').value.trim(),status:$('inquiryStatus').value});const d=await api('/api/staff/inquiries?'+p);$('inquiryList').innerHTML=d.inquiries.length?d.inquiries.map(i=>`<button class="item click" data-inquiry="${esc(i.id)}"><div class="row"><b>${esc(i.inquiryNo)} ${esc(i.requesterName)}</b>${badge(i.status)}</div><div class="muted">${esc(i.requesterPhone||'')}／${fmt(i.createdAt)}</div><div>${esc(i.summary)}</div></button>`).join(''):'<div class="empty">該当する担当相談はありません。</div>';document.querySelectorAll('[data-inquiry]').forEach(b=>b.onclick=()=>openInquiry(b.dataset.inquiry))}catch(e){showStatus('globalStatus',e.message,'error')}}
  async function openInquiry(id){try{const d=await api(`/api/staff/inquiries/${id}`),i=d.inquiry;state.currentInquiry=i;$('inquiryDetail').innerHTML=`<h2>${esc(i.inquiryNo)}</h2><div>${badge(i.status)} ${badge(i.urgency)}</div><div class="facts"><div class="fact"><span>相談者</span><b>${esc(i.requesterName)}</b></div><div class="fact"><span>電話</span><b>${esc(i.requesterPhone||'—')}</b></div><div class="fact"><span>受付日時</span><b>${fmt(i.createdAt)}</b></div><div class="fact"><span>希望連絡</span><b>${esc(label(i.preferredContactMethod))}</b></div></div><div class="item">${esc(i.summary)}</div><div class="form"><label>状態<select id="editInquiryStatus" class="control"><option value="new">新規</option><option value="reviewing">確認中</option><option value="contacting">連絡中</option><option value="appointment_scheduled">面談調整済み</option><option value="closed">終了</option></select></label><label>対応記録<textarea id="editInquiryNote" class="control" placeholder="電話連絡、折返し、説明内容など"></textarea></label><button id="saveInquiry" class="btn primary" type="button">対応記録を保存</button></div><h2 style="margin-top:18px">対応履歴</h2><div class="list">${d.communications.length?d.communications.map(c=>`<div class="item"><div class="muted">${fmt(c.occurredAt)}</div><b>${esc(c.subject||'対応記録')}</b><div>${esc(c.summary||'')}</div></div>`).join(''):'<div class="empty">対応履歴はありません。</div>'}</div>`;$('editInquiryStatus').value=i.status;$('saveInquiry').onclick=saveInquiry}catch(e){showStatus('globalStatus',e.message,'error')}}
  async function saveInquiry(){const i=state.currentInquiry,b=$('saveInquiry');b.disabled=true;try{await api(`/api/staff/inquiries/${i.id}/update`,{method:'POST',body:{lockVersion:i.lockVersion,status:$('editInquiryStatus').value,contactNote:$('editInquiryNote').value.trim()}});showStatus('globalStatus','相談対応を保存しました。');await Promise.all([loadInquiries(),loadDashboard()]);await openInquiry(i.id)}catch(e){showStatus('globalStatus',e.message,'error')}finally{b.disabled=false}}
  async function loadCases(){try{const p=new URLSearchParams({q:$('caseQ').value.trim(),status:$('caseStatus').value});const d=await api('/api/staff/cases?'+p);$('caseList').innerHTML=d.cases.length?d.cases.map(c=>`<button class="item click" data-case="${esc(c.id)}"><div class="row"><b>${esc(c.caseNo)} ${esc(c.client?.name||'')}</b>${badge(c.status)}</div><div>${esc(c.nextAction||'次の対応未登録')}</div><div class="muted">期限 ${fmt(c.nextActionDueAt)}</div></button>`).join(''):'<div class="empty">該当する担当案件はありません。</div>';document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case))}catch(e){showStatus('globalStatus',e.message,'error')}}
  async function openCase(id){try{const d=await api(`/api/staff/cases/${id}`),c=d.case;state.currentCase=c;$('caseDetail').innerHTML=`<h2>${esc(c.caseNo)}</h2><div>${badge(c.status)}</div><div class="facts"><div class="fact"><span>利用者</span><b>${esc(c.client?.clientNo||'')} ${esc(c.client?.name||'')}</b></div><div class="fact"><span>電話</span><b>${esc(c.client?.phone||'—')}</b></div><div class="fact"><span>次回モニタリング</span><b>${esc(c.client?.nextMonitoringDueOn||'—')}</b></div><div class="fact"><span>更新</span><b>${fmt(c.updatedAt)}</b></div></div><div class="form"><label>次の対応<input id="editCaseNext" class="control" value="${esc(c.nextAction||'')}"></label><label>次回対応期限<input id="editCaseDue" class="control" type="datetime-local"></label><button id="saveCase" class="btn primary" type="button">次の対応を保存</button></div><h2 style="margin-top:18px">担当タスク</h2><div class="list">${d.tasks.length?d.tasks.map(t=>`<div class="item"><div class="row"><b>${esc(t.taskNo)} ${esc(t.title)}</b>${badge(t.status)}</div><div class="muted">期限 ${fmt(t.dueAt)}</div></div>`).join(''):'<div class="empty">担当タスクはありません。</div>'}</div><h2 style="margin-top:18px">今後の予定</h2><div class="list">${d.appointments.length?d.appointments.map(a=>`<div class="item"><b>${fmt(a.startAt)}</b><div>${esc(a.location||label(a.appointmentType))}</div></div>`).join(''):'<div class="empty">予定はありません。</div>'}</div>`;if(c.nextActionDueAt){const x=new Date(c.nextActionDueAt);$('editCaseDue').value=new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,16)}$('saveCase').onclick=saveCase}catch(e){showStatus('globalStatus',e.message,'error')}}
  async function saveCase(){const c=state.currentCase,b=$('saveCase');b.disabled=true;try{await api(`/api/staff/cases/${c.id}/next-action`,{method:'POST',body:{lockVersion:c.lockVersion,nextAction:$('editCaseNext').value.trim(),nextActionDueAt:$('editCaseDue').value?new Date($('editCaseDue').value).toISOString():null}});showStatus('globalStatus','次の対応を保存しました。');await Promise.all([loadCases(),loadDashboard()]);await openCase(c.id)}catch(e){showStatus('globalStatus',e.message,'error')}finally{b.disabled=false}}
  $('loginForm').onsubmit=e=>{e.preventDefault();login()};$('clearStaffCode').onclick=()=>{$('staffCode').value='';$('staffCode').focus()};$('clearAccessCode').onclick=()=>{$('accessCode').value='';$('accessCode').focus()};$('logout').onclick=logout;$('refresh').onclick=()=>switchView(state.view);$('searchInquiries').onclick=loadInquiries;$('searchCases').onclick=loadCases;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
  (async()=>{if(await validate())await showApp();else{sessionStorage.removeItem('sodan_staff_token');requestAnimationFrame(()=>$('staffCode').focus())}})();
})();
</script>
