<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153e52"><meta name="robots" content="noindex,nofollow">
  <title>DPRO相談支援センター｜システム検査</title><script src="config.js"></script>
  <style>
    :root{--main:#153e52;--main2:#176b68;--bg:#eef4f5;--card:#fff;--text:#14252b;--muted:#607176;--line:#c8d7da;--danger:#b42318;--dangerbg:#fff1f0;--ok:#18794e;--okbg:#edf9f2;--warn:#9a6700;--warnbg:#fff8df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.55}button,input{font:inherit;min-height:46px}button{cursor:pointer}.hidden{display:none!important}.control{width:100%;border:1px solid #94adb2;border-radius:10px;padding:10px 12px;background:#fff}.primary,.secondary,.danger{border-radius:10px;padding:10px 14px;font-weight:850}.primary{border:0;background:var(--main2);color:#fff}.secondary{border:1px solid #8eafb4;background:#fff;color:var(--main)}.danger{border:1px solid #d8a19b;background:#fff;color:var(--danger)}button:disabled{opacity:.55}.wide{width:100%}.status{display:none;border-radius:10px;padding:12px 14px;margin:12px 0}.status.show{display:block}.status.error{background:var(--dangerbg);border:1px solid #efa59e;color:#7a271a}.status.success{background:var(--okbg);border:1px solid #9fd7b9;color:#125b3b}.login-wrap{width:min(520px,100%);margin:auto;padding:42px 16px}.brand{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;padding:24px;border-radius:18px 18px 0 0}.brand h1{margin:4px 0}.login-card{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:24px}.field{margin-bottom:16px}.field label{display:block;font-weight:850;margin-bottom:6px}.code-row{display:grid;grid-template-columns:1fr 84px;gap:8px}.mask{-webkit-text-security:disc}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:22px}.main{padding:18px;max-width:1450px;margin:auto}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.metric span{display:block;color:var(--muted);font-size:13px}.metric b{font-size:25px}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,.65fr);gap:13px;margin-top:13px}.check-list{display:grid;gap:8px}.check{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px}.icon{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--ok);font-weight:900}.check.fail .icon{background:var(--dangerbg);color:var(--danger)}.badge{border-radius:999px;padding:3px 8px;font-size:12px;font-weight:850;background:var(--okbg);color:var(--ok)}.check.fail .badge{background:var(--dangerbg);color:var(--danger)}.muted{color:var(--muted);font-size:13px}.warning{background:var(--warnbg);border:1px solid #e2c764;border-radius:10px;padding:11px;margin-bottom:12px}.raw{max-height:360px;overflow:auto;background:#102a36;color:#e8f4f7;border-radius:10px;padding:12px;font:12px/1.55 monospace;white-space:pre-wrap}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{background:#f4f8f8;border-radius:9px;padding:9px}.kv b{display:block;color:var(--muted);font-size:12px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}@media(max-width:900px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:540px){.top{display:block}.summary{gap:7px}.main{padding:11px}.code-row{grid-template-columns:1fr}.info{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="loginView" class="login-wrap"><div class="brand"><div>DPRO SODAN</div><h1>システム検査</h1><div>SODAN-12 職員権限分離を含む一括検査</div></div><div class="login-card"><div id="loginStatus" class="status"></div><div class="field"><label>管理コード</label><div class="code-row"><input id="adminCode" class="control mask" autocomplete="one-time-code"><button id="clearCode" class="secondary" type="button">削除</button></div></div><button id="loginButton" class="primary wide" type="button">ログインして検査</button><button id="backLogin" class="secondary wide" style="margin-top:9px" type="button">管理画面へ戻る</button></div></div>
<div id="appView" class="hidden"><header class="top"><div><h1>システム検査・デモ準備</h1><div id="officeLabel" class="muted">DPRO相談支援センター（デモ）</div></div><div><button id="backOwner" class="secondary" type="button">管理画面へ戻る</button> <button id="logout" class="secondary" type="button">ログアウト</button></div></header><main class="main"><div id="globalStatus" class="status"></div><section class="summary"><div class="metric"><span>Worker</span><b id="workerVersion">—</b></div><div class="metric"><span>検査件数</span><b id="totalCount">—</b></div><div class="metric"><span>合格</span><b id="passedCount">—</b></div><div class="metric"><span>失敗</span><b id="failedCount">—</b></div></section><div class="grid"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><h2 style="margin:0">一括検査</h2><div id="lastChecked" class="muted">未実行</div></div><button id="runCheck" class="primary" type="button">一括検査を実行</button></div><div id="checkList" class="check-list" style="margin-top:13px"></div><details style="margin-top:13px"><summary>検査JSON</summary><pre id="rawJson" class="raw">未実行</pre></details></section><aside><section class="card"><h2>接続情報</h2><div class="info"><div class="kv"><b>環境</b><span id="environment">—</span></div><div class="kv"><b>事業所コード</b><span id="officeCode">—</span></div><div class="kv"><b>DB基盤</b><span id="databaseVersion">—</span></div><div class="kv"><b>Web版</b><span id="webVersion">—</span></div></div></section><section class="card" style="margin-top:13px"><h2>デモ基本データを準備</h2><div class="warning"><b>デモ環境専用</b><br>既存データを一括削除せず、不足する標準データを更新します。</div><label><input id="demoCheck" type="checkbox"> 対象が <b>dpro_sodan_demo</b> であることを確認しました。</label><div class="field" style="margin-top:11px"><label>「DEMO」と入力</label><input id="demoText" class="control" maxlength="4"></div><button id="prepareDemo" class="danger wide" disabled type="button">デモ基本データを準備</button><div id="demoStatus" class="status"></div><details><summary>準備結果JSON</summary><pre id="demoRaw" class="raw">未実行</pre></details></section></aside></div><div id="version" class="footer"></div></main></div>
<script>
(()=>{'use strict';const C=window.DPRO_CONFIG||{},API=String(C.workerUrl||'').replace(/\/+$/,''),$=id=>document.getElementById(id);const state={token:sessionStorage.getItem('sodan_owner_token')||''};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(id,m,t){const e=$(id);e.textContent=m;e.className=`status show ${t}`}async function api(p,o={}){const h=new Headers({'Content-Type':'application/json'});if(state.token)h.set('Authorization',`Bearer ${state.token}`);const r=await fetch(API+p,{method:o.method||'GET',headers:h,body:o.body===undefined?undefined:JSON.stringify(o.body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false){const e=new Error(d.message||`処理失敗 ${r.status}`);e.status=r.status;throw e}return d}function owner(){location.href='owner.html'}function demoReady(){return $('demoCheck').checked&&$('demoText').value.trim().toUpperCase()==='DEMO'}function updateDemo(){$('prepareDemo').disabled=!demoReady()}async function login(){const code=$('adminCode').value.trim();if(!code){status('loginStatus','管理コードを入力してください。','error');return}try{const d=await api('/api/auth/admin/login',{method:'POST',body:{adminCode:code,staffCode:'DEMO-ADMIN'}});state.token=d.accessToken;sessionStorage.setItem('sodan_owner_token',state.token);$('adminCode').value='';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('version').textContent=C.version||'';await run()}catch(e){status('loginStatus',e.message,'error')}}async function validate(){if(!state.token)return false;try{await api('/api/auth/session');return true}catch{return false}}async function run(){const b=$('runCheck');b.disabled=true;b.textContent='検査中…';try{const [h,d]=await Promise.all([api('/api/health'),api('/api/system-check')]);$('workerVersion').textContent=d.workerVersion||'—';$('totalCount').textContent=d.summary?.total??'—';$('passedCount').textContent=d.summary?.passed??'—';$('failedCount').textContent=d.summary?.failed??'—';$('databaseVersion').textContent=d.requiredDatabaseVersion||'—';$('lastChecked').textContent=d.checkedAt?`最終検査：${new Date(d.checkedAt).toLocaleString('ja-JP')}`:'未実行';$('environment').textContent=h.environment||C.environment||'—';$('officeCode').textContent=h.officeCode||C.officeCode||'—';$('webVersion').textContent=C.version||'—';$('officeLabel').textContent=d.checks?.find(x=>x.key==='office')?.actual?.officeName||'DPRO相談支援センター（デモ）';$('rawJson').textContent=JSON.stringify(d,null,2);$('checkList').innerHTML=(d.checks||[]).map(c=>`<div class="check ${c.ok?'':'fail'}"><div class="icon">${c.ok?'✓':'!'}</div><div><b>${esc(c.label||c.key)}</b><div class="muted">${esc(c.key)}</div>${c.error?`<div class="muted" style="color:var(--danger)">${esc(c.error)}</div>`:''}</div><span class="badge">${c.ok?'合格':'要確認'}</span></div>`).join('');status('globalStatus',d.ok?`一括検査は${d.summary.passed}/${d.summary.total}件合格です。`:`${d.summary.failed}件の要確認があります。`,d.ok?'success':'error')}catch(e){status('globalStatus',e.message,'error')}finally{b.disabled=false;b.textContent='一括検査を実行'}}async function prepare(){if(!demoReady())return;if(!confirm('dpro_sodan_demo の基本データを準備します。実行しますか？'))return;const b=$('prepareDemo');b.disabled=true;try{const d=await api('/api/demo_prepare',{method:'POST'});$('demoRaw').textContent=JSON.stringify(d,null,2);status('demoStatus','デモ基本データを準備しました。','success');$('demoCheck').checked=false;$('demoText').value='';await run()}catch(e){status('demoStatus',e.message,'error')}finally{updateDemo()}}$('loginButton').onclick=login;$('adminCode').onkeydown=e=>{if(e.key==='Enter')login()};$('clearCode').onclick=()=>{$('adminCode').value='';$('adminCode').focus()};$('backLogin').onclick=owner;$('backOwner').onclick=owner;$('logout').onclick=()=>{sessionStorage.removeItem('sodan_owner_token');location.reload()};$('runCheck').onclick=run;$('demoCheck').onchange=updateDemo;$('demoText').oninput=updateDemo;$('prepareDemo').onclick=prepare;(async()=>{if(await validate()){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('version').textContent=C.version||'';await run()}else requestAnimationFrame(()=>$('adminCode').focus())})();})();
</script></body></html>
